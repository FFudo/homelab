apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meilisearch
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/meilisearch/meilisearch-kubernetes.git
    targetRevision: main
    path: charts/meilisearch
    helm:
      releaseName: meilisearch
      values: |
        auth:
          existingMasterKeySecret: meili-master-key
        persistence:
          enabled: true
          size: 20Gi
          accessMode: ReadWriteMany
          storageClass: nfs-client

  destination:
    server: https://kubernetes.default.svc
    namespace: meilisearch

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
