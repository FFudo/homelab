apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudlfare-clusterissuer
spec:
  acme:
    email: ffudo@ik.me
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: cloudlfare-clusterissuer-account-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token