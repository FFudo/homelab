---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-ingressroute
  namespace: homepage
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`homepage.home.ffudo.me`)
      kind: Rule
      services:
        - name: homepage
          port: 3000
  tls:
    secretName: homepage-certificate-secret
