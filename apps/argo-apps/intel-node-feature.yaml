apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfd-nodefeature-rules
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/intel/intel-device-plugins-for-kubernetes
    targetRevision: ">=v0.32.0"
    path: deployments/nfd/overlays/node-feature-rules
  destination:
    server: https://kubernetes.default.svc
    namespace: node-feature-discovery

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
