apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-crs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FFudo/homelab
    targetRevision: main
    path: apps/cert-manager
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
