apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudbeaver
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FFudo/homelab
    targetRevision: main  
    path: apps/cloudbeaver
  destination:
    server: https://kubernetes.default.svc 
    namespace: cloudbeaver
  syncPolicy:
    automated:
      prune: true  
      selfHeal: true  
    syncOptions:
    - CreateNamespace=true  
