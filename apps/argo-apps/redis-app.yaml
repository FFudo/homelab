apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  sources:
  # =============== Helm Chart ===============
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: redis                              
      targetRevision: 20.13.3                        
      helm:
        releaseName: redis
        values: |
          architecture: replication
          auth:
            existingSecret: redis-env
            existingSecretPasswordKey: password
          master:
            service:
              type: LoadBalancer
              loadBalancerIP: 10.0.0.56
            persistence:
              storageClass: longhorn
              accessModes: 
                - ReadWriteOnce
              size: 8Gi
          replica:
            persistence:
              storageClass: longhorn
              accessModes: 
                - ReadWriteOnce
              size: 8Gi
  # =============== Sync policy ===============
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
