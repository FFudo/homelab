apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-crs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FFudo/homelab
    targetRevision: main
    path: apps/longhorn
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
