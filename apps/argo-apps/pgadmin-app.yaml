apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgadmin4
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.runix.net    
    chart: pgadmin4                       
    targetRevision: ">=1.39.2"              
    helm:
      releaseName: pgadmin
      values: |                            
        existingSecret: pgadmin-env
        secretKeys:
          pgadminPasswordKey: password
        persistentVolume:
          enabled: true
          storageClass: longhorn           
          accessMode: ReadWriteOnce        
          size: 8Gi
        ingress:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: "traefik"             
            cert-manager.io/cluster-issuer: "cloudlfare-clusterissuer" 
          hosts:
            - host: postgres.home.ffudo.me
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: postgres-certificate-secret
              hosts:
                - postgres.home.ffudo.me             

  destination:
    server: https://kubernetes.default.svc
    namespace: postgres                  

  syncPolicy:
    automated:
      prune: true                      
      selfHeal: true                    
