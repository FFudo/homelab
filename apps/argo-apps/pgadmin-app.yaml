apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgadmin4
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.runix.net    
    chart: pgadmin4                       
    targetRevision: ">=1.39.2"              
    helm:
      releaseName: pgadmin
      values: |                            
        env:
          email: "admin@example.com"       
          password: "SuperSecretPass!"     
        persistentVolume:
          enabled: true
          storageClass: longhorn           
          accessMode: ReadWriteOnce        
          size: 8Gi
        ingress:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: "traefik"             
          hosts:
            - host: postgres.home.ffudo.me
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: postgres-certificate-secret
        service:
          type: ClusterIP                

  destination:
    server: https://kubernetes.default.svc
    namespace: postgres                  

  syncPolicy:
    automated:
      prune: true                      
      selfHeal: true                    
