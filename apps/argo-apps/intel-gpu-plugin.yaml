apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: intel-gpu-plugin
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/intel/intel-device-plugins-for-kubernetes
    targetRevision: ">=v0.32.0"
    path: deployments/gpu_plugin/overlays/nfd_labeled_nodes
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
