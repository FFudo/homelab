apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: commafeed
  namespace: argocd  
spec:
  project: default
  source:
    repoURL: https://github.com/FFudo/homelab
    targetRevision: main  
    path: apps/commafeed  
  destination:
    server: https://kubernetes.default.svc 
    namespace: commafeed
  syncPolicy:
    automated:
      prune: true  
      selfHeal: true  
    syncOptions:
    - CreateNamespace=true 