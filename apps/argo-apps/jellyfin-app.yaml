apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd  
spec:
  project: default
  source:
    repoURL: https://github.com/FFudo/homelab
    targetRevision: main  
    path: apps/jellyfin  
  destination:
    server: https://kubernetes.default.svc 
    namespace: media
  syncPolicy:
    automated:
      prune: true  
      selfHeal: true  
    syncOptions:
    - CreateNamespace=true 