apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd  
spec:
  project: default
  source:
    repoURL: https://github.com/FFudo/homelab
    targetRevision: main
    path: apps/homepage  # Path to your application manifests
  destination:
    server: https://kubernetes.default.svc 
    namespace: homepage
  syncPolicy:
    automated:
      prune: true  
      selfHeal: true  
    syncOptions:
    - CreateNamespace=true  # Auto-create the namespace if it doesn't exist