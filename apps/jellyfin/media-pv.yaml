apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-pv
spec:
  capacity:
    storage: 1Ti 
  accessModes:
    - ReadWriteMany 
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1 
    - hard
    - noatime
  nfs:
    server: 10.0.0.3  # Replace with your Unraid server IP
    path: /mnt/user/mediadata/media  # Replace with your NFS export path
