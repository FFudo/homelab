apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          resources:
            limits:
              gpu.intel.com/i915: "1"
          ports:
            - containerPort: 8096
          volumeMounts:
            - name: media
              mountPath: /media
            - name: jellyfin-config
              mountPath: /cache
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media-pvc
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
