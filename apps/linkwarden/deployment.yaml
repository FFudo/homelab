apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkwarden
  namespace: linkwarden
spec:
  replicas: 1
  selector:
    matchLabels: { app: linkwarden }
  template:
    metadata:
      labels: { app: linkwarden }
    spec:
      containers:
      - name: linkwarden
        image: ghcr.io/linkwarden/linkwarden:latest  # or your built image
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: linkwarden-env               # from your SealedSecret
        volumeMounts:
        - name: data
          mountPath: /data/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: linkwarden-pvc