---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: linkwarden-ingressroute
  namespace: linkwarden
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`linkwarden.home.ffudo.me`)
      kind: Rule
      services:
        - name: linkwarden
          port: 3000
  tls:
    secretName: linkwarden-certificate-secret
