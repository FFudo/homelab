apiVersion: traefik.containo.us/v1alpha1
kind: IngressRouteTCP
metadata:
  name: postgresql-tcp-ingress
  namespace: postgres
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: postgres
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: cloudlfare-clusterissuer
spec:
  entryPoints:
    - postgres
  routes:
    - match: HostSNI(`postgres.home.ffudo.me`)
      services:
        - name: postgres
          port: 5432
