apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-crs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FFudo/homelab
    targetRevision: main
    path: apps/sealed-secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true