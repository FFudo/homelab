apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-samba-pv
spec:
  capacity:
    storage: 1Ti  # Adjust size as needed
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - vers=3.0
    - uid=1000  # Adjust to match Jellyfin container UID
    - gid=1000  # Adjust to match Jellyfin container GID
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: media-samba-share-id  # Must be unique
    volumeAttributes:
      source: //10.0.0.3/mediadata/media
    nodeStageSecretRef:
      name: smbcreds
      namespace: media  # Adjust to your Jellyfin namespace
