apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  namespace: argocd  # The namespace where Argo CD is installed
spec:
  project: default
  source:
    repoURL: https://github.com/FFudo/homelab  # Replace with your Git repo URL
    targetRevision: HEAD  # Or specify a branch, tag, or commit
    path: apps/nginx  # Path to your application manifests
  destination:
    server: https://kubernetes.default.svc 
    namespace: nginx
  syncPolicy:
    automated:
      prune: true  
      selfHeal: true  
    syncOptions:
    - CreateNamespace=true  # Auto-create the namespace if it doesn't exist